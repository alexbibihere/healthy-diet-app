# Codemagic 云打包配置 — 轻食记 LiteBite
# 文档: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# 使用方法：
#   1. 注册 https://codemagic.io （免费 500 分钟/月）
#   2. Add application → 连接 GitHub 仓库 alexbibihere/healthy-diet-app
#   3. 选 Flutter app → 该仓库 → Settings 里 "Workflow configuration" 选此 yaml
#   4. iOS 出包两种模式见下方两个 workflow：
#      - ios-no-sign: 免签名 IPA（配合 AltStore/Sideloadly 自签安装，免费 Apple ID 即可）
#      - ios-sign:    正式签名（需在 Codemagic 上传 Apple 证书 + 描述文件，可上 TestFlight/App Store）
#   5. Android 顺便也配好了：android-release workflow
#
# ⚠️ 仅 iOS 构建需要 macOS 机器（Codemagic 已自动分配）；Android 构建在 linux 上更省额度

workflows:
  # ============ iOS 免签名包（免费 Apple ID + AltStore/Sideloadly 自签） ============
  ios-no-sign:
    name: iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      groups:
        - pub_credentials        # 可选：在 Codemagic 环境变量组里配 PUB_HOSTED_URL 等
      vars:
        BUNDLE_ID: com.alexbibi.litebite
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Flutter 分析 + 测试
        script: |
          flutter analyze
          flutter test
      - name: 构建 IPA（不签名）
        script: flutter build ios --release --no-codesign
      - name: 打包未签名 IPA
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r ../litebite-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - litebite-unsigned.ipa
    publishing:
      email:
        recipients:
          - alexbibihere@users.noreply.github.com
        notify:
          success: true
          failure: true

  # ============ iOS 正式签名（需 Apple 开发者账号 $99/年，可上 TestFlight） ============
  ios-sign:
    name: iOS (signed, TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrating_with: app_store_connect
    environment:
      flutter: stable
      xcode: latest
      # 在 Codemagic 网页端配置：
      #   Teams → Apple Developer 账号（App Store Connect API key）
      #   或手动上传 .p12 证书 + .mobileprovision
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alexbibi.litebite
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: 构建签名 IPA
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.alexbibi.litebite \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
          flutter packages pub get
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - internal-testers   # TestFlight 内测组名（按需改）

  # ============ Android（顺便配好，linux 机器省额度） ============
  android-release:
    name: Android (signed APK)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Flutter pub get + 测试
        script: |
          flutter pub get
          flutter test
      - name: 构建分架构 APK
        script: flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*release.apk

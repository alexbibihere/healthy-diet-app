name: litebite
description: 轻食记 — 离线优先的减脂饮食记录 App
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # 状态管理
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  # 本地数据库
  drift: ">=2.30.0 <2.32.0"
  drift_flutter: ^0.2.4
  # UI
  fl_chart: ^1.2.0
  # 路由
  go_router: ^16.0.0
  # 工具
  path_provider: ^2.1.5
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  drift_dev: ^2.31.0
  riverpod_generator: ^4.0.0
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/images/recipes/
